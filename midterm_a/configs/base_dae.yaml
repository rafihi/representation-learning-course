# Base config for DAE / vanilla-AE pre-training in the PROXY setting (20k images, short runs). Used by the A2 sweep.
# NOTE: write floats with a dot in the mantissa (1.0e-3) in YAML.
task: pretrain
seed: 0
out_dir: runs/dae_proxy
resume: true            # continue from out_dir/ckpt/last.ckpt after a Colab disconnect
skip_if_done: true      # do not repeat a run whose metrics.json already exists
data:
  cache_dir: data_cache # point to Google Drive to keep the downloaded dataset between sessions
  train_per_class: 100  # 100 -> 20k images (proxy). Full setting: 450 -> 90k
  val_per_class: 50     # 10k validation images (held out of train)
  test_per_class: 50    # 10k test images (official valid split); only used in final evaluations
  batch_size: 128
model:
  name: dae
  kind: gaussian        # gaussian | mask | saltpepper | none (none = vanilla AE)
  level: 0.3
  lr: 1.0e-3
  weight_decay: 1.0e-4
trainer:
  max_epochs: 15
  precision: 16-mixed
  knn_every: 5          # log val k-NN every 5 epochs (0 = off)
  ckpt_every: 1
logging:
  logger: tensorboard   # tensorboard | wandb | none
knn:
  k: 20
  T: 0.1
  weight: exp           # k-NN vote weight exp(sim/T)  (sim = plain cosine weight)
