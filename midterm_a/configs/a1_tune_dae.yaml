# A2: random search over >= 3 hyper-parameters (here 4), PROXY setting, selected by validation k-NN (NOT by reconstruction).
task: sweep
base_config: configs/base_dae.yaml
mode: random
n_trials: 20
seed: 0
out_dir: results/a1_tune_dae
plot: a2                       # writes recon_vs_knn.png (the required A2 figure)
space:
  model.kind: {choice: [gaussian, mask, saltpepper]}
  model.level: {uniform: [0.1, 0.6]}
  model.lr: {loguniform: [3.0e-4, 3.0e-3]}
  model.weight_decay: {loguniform: [1.0e-6, 1.0e-3]}
