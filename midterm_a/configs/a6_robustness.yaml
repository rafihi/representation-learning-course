# Assignment A4: k-NN (clean memory bank) and linear-probe (trained on clean features, lr chosen on clean validation)
# accuracy when the EVALUATION images are corrupted.
# Curves of a corruption the model was trained with are marked "SEEN" in the figure / CSV (not an unseen test).
# patch_shuffle = the BONUS test (src/corruptions.py): shuffles a g x g grid of patches; keeps local texture and
# colour exactly, destroys global shape -> does the representation encode object layout or only texture/colour?
task: robustness
seed: 0
out_dir: results/a6_robustness
split: val
data: {cache_dir: data_cache, train_per_class: 450, val_per_class: 50, test_per_class: 50, batch_size: 128}
knn: {k: 20, T: 0.1, weight: exp}
linear_probe: true
probe: {epochs: 100, lr_grid: [1.0e-3, 3.0e-3], wd: 1.0e-4}   # same probe recipe as a4_eval.yaml
corruptions:                     # kind: [levels]
  gaussian: [0, 0.1, 0.2, 0.3, 0.5]
  mask: [0, 0.2, 0.4, 0.6]
  saltpepper: [0, 0.1, 0.2, 0.4]
  contrast: [0, 0.3, 0.5, 0.7, 0.9]
  blur: [0, 0.5, 1.0, 1.5, 2.0]
  patch_shuffle: [0, 2, 4, 8]    # BONUS: grid size (0 = clean)
models:
  - {name: random_init, type: random, seed: 0}
  - {name: vanilla_ae, arch: dae, path: runs/vanilla_ae_final/ckpt/last.ckpt}
  - {name: dae, arch: dae, path: runs/dae_final/ckpt/last.ckpt}
