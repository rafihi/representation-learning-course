# Assignment A3 + A4: fine-tuning ALL weights with 1% / 10% / 100% of the labels (class-balanced, nested, identical
# for every model). 'supervised_scratch' = ResNet-18 from random init trained on the same subsets (reference).
# Budget per run: `epochs` passes over the labelled subset, clipped to [min_steps, max_steps]
#   Tiny-ImageNet: 1% (1,000 labels) -> 500 steps, 10% (9,000) -> 2,110, 100% (90,000) -> 5,000 (~7 epochs).
# Validation is run n_evals times per run; the best-validation step is kept, then the lr is chosen on validation.
# The selected weights are saved in <out_dir>/selected/ so the TEST config only evaluates them (no re-training).
task: finetune
seed: 0
out_dir: results/a5_finetune
split: val                       # final numbers: configs/a5_finetune_test.yaml
datasets: [tiny, transfer]
data: {cache_dir: data_cache, train_per_class: 450, val_per_class: 50, test_per_class: 50, batch_size: 128}
transfer: {name: cifar100, train_per_class: 500, test_per_class: 100}
fractions: [0.01, 0.1, 1.0]
ft: {epochs: 30, min_steps: 500, max_steps: 5000, n_evals: 10, batch_size: 128, warmup_frac: 0.05,
     crop_pad: 4, wd: 5.0e-4, lr_grid: [1.0e-3, 3.0e-4]}
n_boot: 1000
models:
  - {name: supervised_scratch, type: random, seed: 0}
  - {name: vanilla_ae, arch: dae, path: runs/vanilla_ae_final/ckpt/last.ckpt}
  - {name: dae, arch: dae, path: runs/dae_final/ckpt/last.ckpt}
