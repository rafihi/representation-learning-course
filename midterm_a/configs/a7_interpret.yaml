# Assignment A5: per-class k-NN accuracy (failure classes), t-SNE and nearest-neighbour retrieval grids.
task: interpret
seed: 0
out_dir: results/a7_interpret
split: val
data: {cache_dir: data_cache, train_per_class: 450, val_per_class: 50, test_per_class: 50, batch_size: 128}
knn: {k: 20, T: 0.1, weight: exp}
tsne_classes: 10
retrieval_models: [random_init, vanilla_ae, dae]   # same queries for every model
models:
  - {name: random_init, type: random, seed: 0}
  - {name: vanilla_ae, arch: dae, path: runs/vanilla_ae_final/ckpt/last.ckpt}
  - {name: dae, arch: dae, path: runs/dae_final/ckpt/last.ckpt}
