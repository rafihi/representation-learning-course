# Assignment A1/A2: final DAE in the FULL setting (450 img/class, 60 epochs).
# The hyper-parameters are taken AUTOMATICALLY from the best validation-k-NN trial of the A2 sweep (`from_sweep`),
# the values under `model:` are only a fallback and are overwritten. The chosen trial is printed and stored in metrics.json.
extends: configs/base_dae.yaml
out_dir: runs/dae_final
data: {train_per_class: 450, batch_size: 128}
from_sweep:
  csv: results/a1_tune_dae/results.csv
  keys: [model.kind, model.level, model.lr, model.weight_decay]
model: {kind: gaussian, level: 0.5016725270731012, lr: 0.0004165006165449, weight_decay: 0.00004255688904725068}
trainer: {max_epochs: 60, knn_every: 10}
